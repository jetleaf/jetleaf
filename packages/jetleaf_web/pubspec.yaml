name: jetleaf_web
description: Web context for Jetleaf — provides HTTP, routing, and client-server helpers.
version: 1.0.0

homepage: https://jetleaf.hapnium.com
repository: https://github.com/jetleaf/jetleaf_web
issue_tracker: https://github.com/jetleaf/jetleaf_web/issues
documentation: https://jetleaf.hapnium.com/docs/web

topics:
  - web
  - http
  - routing
  - jetleaf
  - client-server

keywords:
  - jetleaf
  - web
  - http
  - routing
  - server

resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  jetleaf_lang: any
  jtl: any
  jetson: any
  jetleaf_logging: any
  jetleaf_pod: any
  jetleaf_core: any
  jetleaf_env: any
  jetleaf_utils: any

dev_dependencies:
  test: ^1.29.0
  meta: ^1.18.0
  lints: ^6.0.0