name: jetleaf_web_example
description: Demonstrates routing, URI building, HTTP abstractions, and REST controllers with Jetleaf Web.
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  jetleaf_core: ^2.0.0
  jetleaf_web: ^2.0.0
  jetson: ^2.0.0
  jtl: ^2.0.0

dependency_overrides:
  jetleaf_core:
    path: ../../../libraries/jetleaf_core
  jetleaf_tools:
    path: ../../../libraries/jetleaf_tools
  jetson:
    path: ../../jetson
  jtl:
    path: ../../jtl
  jetleaf_web:
    path: ../
