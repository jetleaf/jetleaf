name: jetson
description: Object mapping and serialization core for Jetleaf — provides JSON, model binding, and conversion utilities.
version: 1.0.0

homepage: https://jetleaf.hapnium.com
repository: https://github.com/jetleaf/jetson
issue_tracker: https://github.com/jetleaf/jetson/issues
documentation: https://jetleaf.hapnium.com/docs/jetson

topics:
  - serialization
  - json
  - mapping
  - jetleaf
  - conversion

keywords:
  - jetleaf
  - jetson
  - serialization
  - json
  - mapper

resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  jetleaf_lang: any
  jetleaf_convert: any
  jetleaf_pod: any
  jetleaf_utils: any
  jetleaf_core: any
  jetleaf_env: any

dev_dependencies:
  test: ^1.29.0
  meta: ^1.18.0
  lints: ^6.0.0