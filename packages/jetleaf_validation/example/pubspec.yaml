name: jetleaf_validation_example
description: Demonstrates declarative constraints, email validation, and range checks using jetleaf_validation 2.0.0.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  jetleaf_validation:
    path: ../
  jetleaf_core:
    path: ../../../libraries/jetleaf_core

dependency_overrides:
  jetleaf_validation:
    path: ../
  jetleaf_core:
    path: ../../../libraries/jetleaf_core
  jetleaf_tools:
    path: ../../../libraries/jetleaf_tools

dev_dependencies:
  lints: ^6.0.0
