  crypto: ^3.0.6
  pointycastle: ^4.0.0
  http: ^1.2.0
  jetleaf_core: ^2.1.0
  jetleaf_web: ^2.1.0

dev_dependencies:
  test: ^1.29.0
  lints: ^6.0.0