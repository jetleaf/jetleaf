name: jetleaf_resource_example
description: Demonstrates caching, eviction policies, TTL, and rate-limiting using jetleaf_resource 2.0.0.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  jetleaf_resource:
    path: ../
  jetleaf_core:
    path: ../../../libraries/jetleaf_core

dependency_overrides:
  jetleaf_resource:
    path: ../
  jetleaf_core:
    path: ../../../libraries/jetleaf_core
  jetleaf_tools:
    path: ../../../libraries/jetleaf_tools

dev_dependencies:
  lints: ^6.0.0