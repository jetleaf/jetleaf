name: jetleaf
description: Enterprise-grade backend framework bringing dependency injection and lifecycle management to Dart.
version: 1.0.0

homepage: https://jetleaf.hapnium.com
repository: https://github.com/jetleaf/jetleaf
issue_tracker: https://github.com/jetleaf/jetleaf/issues
documentation: https://jetleaf.hapnium.com/docs

topics:
  - dart-backend
  - ioc
  - dependency-injection
  - jetleaf
  - framework

keywords:
  - ioc
  - dependency-injection
  - backend-framework
  - lifecycle
  - jetleaf

publish_to: none

environment:
  sdk: ^3.9.0

workspace:
  - libraries/jetleaf_core
  - libraries/jetleaf_tools
  - packages/jtl
  - packages/jetson
  - packages/jetleaf_resource
  - packages/jetleaf_retry
  - packages/jetleaf_scheduling
  - packages/jetleaf_validation
  - packages/jetleaf_monitor
  - packages/jetleaf_web
