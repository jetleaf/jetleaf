name: jetleaf_tools
description: Build, runtime scanning, code generation, and developer tooling for the Jetleaf framework.
version: 1.0.0
homepage: https://jetleaf.hapnium.com
repository: https://github.com/jetleaf/jetleaf
issue_tracker: https://github.com/jetleaf/jetleaf/issues
documentation: https://jetleaf.hapnium.com/docs/tools

keywords:
  - jetleaf
  - build
  - codegen
  - generator
  - tooling
topics:
  - build
  - codegen
  - jetleaf
  - generator
  - tooling

environment:
  sdk: ^3.9.0

resolution: workspace

executables:
  jl: jl

dependencies:
  meta: ^1.18.3
  analyzer: ^10.2.0
  frontend_server_client: ^4.0.0
  path: ^1.9.1
  vm_service: ^15.0.2

dev_dependencies:
  test: ^1.31.1
  lints: ^6.1.0